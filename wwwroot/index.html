<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalkulator</title>

    <!-- CSS wygenerowany z SASS w CI/CD -->
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div class="calculator">
        <h1>Kalkulator</h1>

        <div class="field">
            <label for="a">Liczba A</label>
            <input type="number" id="a" placeholder="np. 12" />
        </div>

        <div class="field">
            <label for="b">Liczba B</label>
            <input type="number" id="b" placeholder="np. 3" />
        </div>

        <div class="field">
            <label for="result">Wynik</label>
            <input type="text" id="result" placeholder="wynik..." readonly />
        </div>

        <div class="buttons">
            <button type="button" onclick="calculate('+')">+</button>
            <button type="button" onclick="calculate('-')">−</button>
            <button type="button" onclick="calculate('*')">×</button>
            <button type="button" onclick="calculate('/')">÷</button>
        </div>

        <div class="footerHint">
            Tip: wpisz liczby i wybierz działanie
        </div>
    </div>

    <!-- ZMINIFIKOWANY JS (artefakt builda CI/CD) -->
    <script src="js/app.min.js"></script>
</body>
</html>
